spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/safecampus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8080

app.jwt.secret=${JWT_SECRET:SafeCampusDemoSecretKeyChangeThisToAtLeast32CharactersLong}
app.jwt.expiration=86400000